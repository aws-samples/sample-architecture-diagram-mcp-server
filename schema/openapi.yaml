# Generated from server/adapters/inbound/mcp/contracts.ts — do not edit (npm run build:schema).
openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "AWS architecture diagram MCP server — contracts"
  version: "2.5.0"
  description: "Contracts of the sample-architecture-diagram-mcp-server: the diagram, sequence, flow, typed-diagram, layout and component schemas, and one operation per MCP tool (operationId = tool name, requestBody = the tool input as announced in tools/list). There is NO HTTP server: the operations are carried by MCP over stdio (x-transport: mcp) and, where x-cli is given, by the CLI of the same package (x-transport: cli). Paths are nominal."
  license:
    name: "MIT-0"
    identifier: "MIT-0"
servers: []
paths:
  /tools/auto_generate_diagram:
    post:
      operationId: "auto_generate_diagram"
      summary: "Generate a fully positioned AWS architecture .drawio diagram."
      description: "Generate a fully positioned AWS architecture .drawio diagram. Computes layout, container sizing, badge positions, and edge routing with the SAME ELK compound engine as the interactive HTML — no manual x/y. Containers: pass `groups` + services' `parentId` for arbitrary nesting (multi-VPC, accounts, AZs, on-prem), OR just `subnet` on services for the classic single AWS Cloud → VPC → public/private subnet tree."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoGenerateDiagramInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/generate_diagram:
    post:
      operationId: "generate_diagram"
      summary: "Generate diagram with manual x/y positioning."
      description: "Generate diagram with manual x/y positioning. Use auto_generate_diagram for automatic layout."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDiagramInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/generate_html_diagram:
    post:
      operationId: "generate_html_diagram"
      summary: "Generate an interactive animated HTML diagram with React Flow in ONE call."
      description: "Generate an interactive animated HTML diagram with React Flow in ONE call. Nodes are draggable and clickable (detail modal), edges animate + carry label pills, optional guided walkthrough. Self-contained single HTML file. For staged assembly, use diagram_create + diagram_add_* + diagram_render instead."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateHtmlDiagramInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/list_components:
    post:
      operationId: "list_components"
      summary: "List the components a layout can mount: id, slot (dock, stepCard, nodeModal, header), built-in or custom, and what each does."
      description: "List the components a layout can mount: id, slot (dock, stepCard, nodeModal, header), built-in or custom, and what each does. Use describe_component for one component's props schema."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "components [--slot]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListComponentsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/describe_component:
    post:
      operationId: "describe_component"
      summary: "One component of the catalog, with the JSON Schema of its props."
      description: "One component of the catalog, with the JSON Schema of its props."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "component <id>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeComponentInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/list_layouts:
    post:
      operationId: "list_layouts"
      summary: "List the layouts a spec can name in `layout`: the presets (default = the standard page, cost = cost estimate up front) and the saved layouts (DIAGRAM_LAYOUTS_DIR or ~/.aws-architecture-diagram/layouts"
      description: "List the layouts a spec can name in `layout`: the presets (default = the standard page, cost = cost estimate up front) and the saved layouts (DIAGRAM_LAYOUTS_DIR or ~/.aws-architecture-diagram/layouts)."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "layout list"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListLayoutsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/create_layout:
    post:
      operationId: "create_layout"
      summary: "Save a layout under a name so specs can use it as `layout: \"<name>\"`."
      description: "Save a layout under a name so specs can use it as `layout: \"<name>\"`. Start from a preset with `extends` and change it with `patch` (add / remove / move / replace a component, or set its props), or give whole `slots`; add `theme` tokens, a CSS file and `branding` (local logo/favicon files, inlined). Validated before saving; presets are read-only."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "layout new <name> [--from base]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLayoutInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/update_layout:
    post:
      operationId: "update_layout"
      summary: "Change a saved layout: append `patch` ops and/or replace top-level keys with `set` (null deletes a key)."
      description: "Change a saved layout: append `patch` ops and/or replace top-level keys with `set` (null deletes a key). Validated before saving."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLayoutInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/validate_layout:
    post:
      operationId: "validate_layout"
      summary: "Resolve a layout without rendering: checks component ids, slots, props, extends chain and files, and reports the components per slot and whether it needs a bundle (custom components)."
      description: "Resolve a layout without rendering: checks component ids, slots, props, extends chain and files, and reports the components per slot and whether it needs a bundle (custom components)."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "layout validate <name|file>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateLayoutInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/preview_layout:
    post:
      operationId: "preview_layout"
      summary: "Render a small generic diagram (edge, API, data; caption, walkthrough, cost link, two languages) with a layout, to see it without writing a spec."
      description: "Render a small generic diagram (edge, API, data; caption, walkthrough, cost link, two languages) with a layout, to see it without writing a spec."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "layout preview <name|file> [--out]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewLayoutInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/build_bundle:
    post:
      operationId: "build_bundle"
      summary: "Build the page that includes a layout's custom components (Vite build of the standalone page, cached by a hash of the components, the base page and the package version)."
      description: "Build the page that includes a layout's custom components (Vite build of the standalone page, cached by a hash of the components, the base page and the package version). Layouts with only built-in components need no build. Requires a clone of the repository with dev dependencies installed; the npm package cannot build."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "layout build <name|file>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildBundleInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/render_from_spec:
    post:
      operationId: "render_from_spec"
      summary: "Re-render a diagram from a spec file — the <name>.spec.json written next to every generated HTML, or any file with the generate_html_diagram input."
      description: "Re-render a diagram from a spec file — the <name>.spec.json written next to every generated HTML, or any file with the generate_html_diagram input. Validates it, applies its layout (or `layout` here), and writes the HTML, the elements JSON and (unless writeSpec:false or it is the input itself) the spec next to it."
      x-transport:
        - "mcp"
        - "cli"
      x-cli: "render <spec.json> [--out] [--layout] [--no-spec] [--no-build]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderFromSpecInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/validate_diagram:
    post:
      operationId: "validate_diagram"
      summary: "Validate a diagram IR (services + connections + groups + steps) for well-formedness — orphan nodes, dangling connection endpoints, duplicate ids, missing icons, broken parent references, group cycles,"
      description: "Validate a diagram IR (services + connections + groups + steps) for well-formedness — orphan nodes, dangling connection endpoints, duplicate ids, missing icons, broken parent references, group cycles, and unreachable/dangling walkthrough steps. Returns a structured report with STABLE rule codes and, when repair=true (default), the auto-repaired IR plus a receipt of every change. The render tools (generate_html_diagram / diagram_render) run this same pass automatically; call this to lint first or in CI."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateDiagramInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_delta:
    post:
      operationId: "diagram_delta"
      summary: "Render an ARCHITECTURE DELTA — a before→after comparison of two diagram IRs as ONE self-contained interactive HTML."
      description: "Render an ARCHITECTURE DELTA — a before→after comparison of two diagram IRs as ONE self-contained interactive HTML. Every service/connection/group is tagged added / removed / changed / unchanged; the viewer gets a Before / Delta / After toggle (added=green, removed=red, changed=amber). Layout is computed once over the union so nodes keep their position as you flip views. Pass the SAME service/connection/group shapes as generate_html_diagram, split into `before` and `after`."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramDeltaInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/export_diagram:
    post:
      operationId: "export_diagram"
      summary: "Export a .drawio file (from auto_generate_diagram / generate_diagram) to PNG/SVG/PDF."
      description: "Export a .drawio file (from auto_generate_diagram / generate_diagram) to PNG/SVG/PDF. Requires the draw.io desktop CLI (optional dependency)."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDiagramInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/render_diagram_media:
    post:
      operationId: "render_diagram_media"
      summary: "Rasterize an interactive diagram HTML (from generate_html_diagram / diagram_render) into publishable assets: a PNG @2x figure, an animated GIF, and/or an animated SVG."
      description: "Rasterize an interactive diagram HTML (from generate_html_diagram / diagram_render) into publishable assets: a PNG @2x figure, an animated GIF, and/or an animated SVG. GIF has two modes: 'flow' (the dots travelling the edges, one seamless loop) and 'walkthrough' (one animated segment PER guided beat/step, concatenated into a looping tour). The SVG is vector + STILL ANIMATED (the flow-dot SMIL is preserved) — sharp at any size and tiny to serve, but many CMSs incl. the AWS Blog/WordPress BLOCK svg upload, so use SVG for your OWN site/embed and GIF for WordPress. Use this to embed a diagram where JS can't run — blog post, PDF, email, slide. Needs headless Chromium (Playwright) and, for GIF, a full ffmpeg on PATH."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderDiagramMediaInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/list_service_configs:
    post:
      operationId: "list_service_configs"
      summary: "List a service's IaC config fields (CDK/TF properties) — useful when authoring a node's config.iac."
      description: "List a service's IaC config fields (CDK/TF properties) — useful when authoring a node's config.iac. For pricing, hand the diagram off (export_diagram_json) to a pricing app such as aws-cost-app-mcp."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListServiceConfigsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/export_diagram_json:
    post:
      operationId: "export_diagram_json"
      summary: "Extract the diagram's elements as neutral JSON from a generated .html: { title, subtitle, region, direction, services[], connections[], groups[] }."
      description: "Extract the diagram's elements as neutral JSON from a generated .html: { title, subtitle, region, direction, services[], connections[], groups[] }. This is the machine-readable handoff any downstream app consumes (e.g. aws-cost-app-mcp to price it, an inventory or docs generator). Each service carries its display name, role, category, and any authored config (iac/pricing metadata). No pricing or IaC is performed here — this server only draws the diagram and hands off its structure."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDiagramJsonInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/export_iac_json:
    post:
      operationId: "export_iac_json"
      summary: "Extract an Infrastructure-as-Code handoff payload from a generated diagram's services and connections, for the official AWS IaC MCP (awslabs.aws-iac-mcp-server)."
      description: "Extract an Infrastructure-as-Code handoff payload from a generated diagram's services and connections, for the official AWS IaC MCP (awslabs.aws-iac-mcp-server). This server does NOT generate IaC itself; it returns the architecture (resources + dependencies + any per-node config.iac) plus an instruction telling the agent to use the AWS IaC MCP's cdk_best_practices / search_cdk_samples_and_constructs and validate before deploy."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportIacJsonInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/list_shapes:
    post:
      operationId: "list_shapes"
      summary: "List common AWS4 drawio shape names for the .drawio path (auto_generate_diagram/generate_diagram, field `shape`)."
      description: "List common AWS4 drawio shape names for the .drawio path (auto_generate_diagram/generate_diagram, field `shape`). For the interactive HTML path use service display names + resolve_icon instead."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListShapesInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/resolve_icon:
    post:
      operationId: "resolve_icon"
      summary: "Resolve an AWS service display name to its icon filename."
      description: "Resolve an AWS service display name to its icon filename. Omit `service` to list all mapped services. The generator auto-resolves icons from service names, so passing `icon` in services is optional."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIconInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/setup_icons:
    post:
      operationId: "setup_icons"
      summary: "Install the AWS Architecture Icons (once per machine) so diagrams render real service icons instead of category-colored initials."
      description: "Install the AWS Architecture Icons (once per machine) so diagrams render real service icons instead of category-colored initials. Call this when a generate/validate result reports unresolved icons. With no argument it picks up the newest Icon-package*.zip (or older Asset-Package*.zip) from ~/Downloads/~/Desktop; if none is there, it returns the download instructions to relay to the user. Icons install to ~/.aws-architecture-icons and are shared by every copy of this server."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupIconsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_create:
    post:
      operationId: "diagram_create"
      summary: "Start an incremental diagram draft."
      description: "Start an incremental diagram draft. Returns a draftId; feed it to diagram_add_services / diagram_add_connections / diagram_add_groups / diagram_add_steps in any order, then diagram_render to write the HTML. Use this when building a diagram in stages; use generate_html_diagram for a single-shot build."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramCreateInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_services:
    post:
      operationId: "diagram_add_services"
      summary: "Append services (nodes) to a draft."
      description: "Append services (nodes) to a draft. Same service shape as generate_html_diagram: { id, service, shape, category, icon?, role?, parentId?, subnet?, config? }."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddServicesInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_connections:
    post:
      operationId: "diagram_add_connections"
      summary: "Append connections (edges) to a draft."
      description: "Append connections (edges) to a draft. Same shape as generate_html_diagram: { id, source, target, label?, type?, dashed? }."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddConnectionsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_groups:
    post:
      operationId: "diagram_add_groups"
      summary: "Append container groups to a draft."
      description: "Append container groups to a draft. Same shape as generate_html_diagram: { id, label, parent?, variant?, icon? }."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddGroupsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_steps:
    post:
      operationId: "diagram_add_steps"
      summary: "Append guided-walkthrough beats to a draft."
      description: "Append guided-walkthrough beats to a draft. Same step shape as generate_html_diagram (tone/color/cardSide/nodes/edges/groups/eyebrow/icon/title/body/bullets/chips/sections…)."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddStepsInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_sequence:
    post:
      operationId: "diagram_add_sequence"
      summary: "Attach an animated UML SEQUENCE view to a draft (participants + ordered messages, alt/opt/loop fragments, notes)."
      description: "Attach an animated UML SEQUENCE view to a draft (participants + ordered messages, alt/opt/loop fragments, notes). The rendered HTML becomes a two-tab document: Architecture + Sequence. Call once per sequence tab; pass `tabLabel` to name the tab."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddSequenceInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_add_doc_tab:
    post:
      operationId: "diagram_add_doc_tab"
      summary: "Attach a prose tab (readable sections: title + body + bullets + code) to a draft — the written companion to the architecture and sequence tabs in the same self-contained file."
      description: "Attach a prose tab (readable sections: title + body + bullets + code) to a draft — the written companion to the architecture and sequence tabs in the same self-contained file."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramAddDocTabInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/diagram_render:
    post:
      operationId: "diagram_render"
      summary: "Render an incremental draft to a self-contained HTML file, then discard the draft."
      description: "Render an incremental draft to a self-contained HTML file, then discard the draft. Pass keep:true to keep the draft for further edits."
      x-transport:
        - "mcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramRenderInput"
      responses:
        "200":
          description: "MCP tool result: text content (and isError on failure)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/generate_sequence_diagram:
    post:
      operationId: "generate_sequence_diagram"
