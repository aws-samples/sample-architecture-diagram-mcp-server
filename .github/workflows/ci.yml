name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: this workflow only reads the repo and runs tests/build.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      # Actions pinned to the full commit SHA of the official v4 release (tags
      # are mutable). checkout drops the auth token since no Git ops are done.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
